# =============================================================================
# Nginx para motopanda.mx (VPS)
#
# Se copia a /etc/nginx/sites-available/motopanda.mx y se enlaza desde
# sites-enabled:
#
#     ln -s /etc/nginx/sites-available/motopanda.mx \
#           /etc/nginx/sites-enabled/motopanda.mx
#     nginx -t && systemctl reload nginx
#
# Traduce 1:1 el comportamiento de deploy/hostinger/htaccess-public_html (que
# gobernaba esto mismo en Apache, en el hosting compartido que se retiró) a la
# sintaxis de Nginx + PHP-FPM. El orden de los bloques importa y no se debe
# alterar.
#
# Un solo certificado cubre los cuatro nombres (sacarlo ANTES de activar este
# archivo, porque nginx -t falla si no existe):
#
#     certbot certonly --nginx --cert-name motopanda.mx \
#         -d motopanda.mx -d www.motopanda.mx \
#         -d prosello.com.mx -d www.prosello.com.mx
# =============================================================================

# Host canónico: motopanda.mx (desde 2026-11-25). Las variantes "www" redirigen
# a la forma limpia porque la cookie de sesión del Panel es host-only: cada host
# es un "sitio" distinto para el navegador.
#
# prosello.com.mx fue el dominio hasta 2026-11-25. Se queda en el bloque
# principal, y no en uno de redirección, porque las App de conductor compiladas
# antes del cambio siguen hablando con prosello.com.mx/api, /gps y /app (Reverb):
# esas rutas se sirven igual en los dos nombres. Lo que sí redirige a
# motopanda.mx es el Panel (todo lo que cae en el SPA). Cuando ya no quede
# ninguna App vieja, prosello.com.mx puede pasar al bloque de redirección.
#
# La carpeta /var/www/delivery.prosello.com.mx conserva su nombre: es una ruta
# interna y la usan provision.sh, config.sh y las unidades de systemd.
server {
    listen 80;
    listen [::]:80;
    server_name motopanda.mx www.motopanda.mx prosello.com.mx www.prosello.com.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.motopanda.mx www.prosello.com.mx;

    ssl_certificate /etc/letsencrypt/live/motopanda.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motopanda.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://motopanda.mx$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name motopanda.mx prosello.com.mx;

    ssl_certificate /etc/letsencrypt/live/motopanda.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motopanda.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/delivery.prosello.com.mx/public_html;
    index index.html;

    client_max_body_size 20m;

    # -------------------------------------------------------------------------
    # Lo que le toca a Laravel: /api/v1/*, /sanctum/* (cookie CSRF) y /up
    # (healthcheck). Van SIEMPRE al front controller (index.php, copiado desde
    # deploy/hostinger/index.php), exista o no como archivo en disco — mismo
    # criterio que la regla de Apache `RewriteRule ^(api|sanctum)(/.*)?$
    # index.php [L]`. No se usa PATH_INFO: Laravel resuelve el ruteo con
    # REQUEST_URI, que fastcgi_params ya manda tal cual.
    # -------------------------------------------------------------------------
    location ~ ^/(api|sanctum|up) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # -------------------------------------------------------------------------
    # Microservicio GPS (spec tenant/028). Vive en el mismo dominio y bajo el
    # mismo certificado: la App del conductor no necesita otro host ni otro
    # candado, y el servicio no expone ningún puerto al exterior — solo escucha
    # en 127.0.0.1:8081 y llega aquí por el proxy.
    #
    # Va ANTES del bloque del SPA: si no, `location /` se tragaría /gps/ y le
    # devolvería index.html a los pings.
    # -------------------------------------------------------------------------
    location /gps/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los pings son diminutos y frecuentes: sin buffering llegan antes y no
        # se acumulan en disco. El cuerpo lo limita el propio servicio a 2 KB
        # (RN-12); aquí se corta mucho antes de que nginx tenga que escribirlo.
        proxy_buffering off;
        client_max_body_size 8k;

        # Plazos cortos a propósito: si el servicio no contesta en dos segundos,
        # es preferible que la App lo dé por caído y acumule sus puntos
        # localmente (RN-19) a que se quede esperando.
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # -------------------------------------------------------------------------
    # Reverb (spec tenant/018). El Panel y la App abren el WebSocket en
    # wss://<dominio>/app/<key>; Reverb solo escucha en 127.0.0.1:8080 (ver
    # deploy/vps/reverb.service). /apps/ es la API HTTP con la que Laravel
    # publica eventos — en producción Laravel llama directo a 127.0.0.1:8080,
    # pero se deja pasar igual por si REVERB_HOST apunta al dominio.
    #
    # Igual que /gps/, tiene que ir ANTES del bloque del SPA.
    # -------------------------------------------------------------------------
    location ~ ^/apps?/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El socket vive minutos u horas; Reverb manda ping cada 60 s.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Healthcheck del servicio, fuera de /gps/ porque así lo define la spec.
    location = /gps-health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Caché inmutable solo para los assets con hash de contenido en el nombre
    # (los .js/.css que genera Vite en cada build).
    # -------------------------------------------------------------------------
    location ~ "-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El índice del SPA siempre se revalida contra el servidor.
    location = /index.html {
        if ($host = prosello.com.mx) { return 301 https://motopanda.mx$request_uri; }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # App de clientes (spec tenant/035): /pide/{flotilla}/... es su propia
    # entrada, `pide.html`, compilada aparte del Panel. Va antes de `location /`:
    # si no, el fallback del Panel respondería su index.html. No usa /app/ porque
    # ese prefijo es de Reverb (más arriba).
    # -------------------------------------------------------------------------
    location = /pide.html {
        if ($host = prosello.com.mx) { return 301 https://motopanda.mx$request_uri; }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /pide/ {
        if ($host = prosello.com.mx) { return 301 https://motopanda.mx$request_uri; }
        try_files $uri /pide.html;
    }

    # -------------------------------------------------------------------------
    # Todo lo demás es del SPA: si el archivo existe en disco se sirve tal
    # cual (assets, favicon), si no responde index.html y el router de Vue
    # resuelve la ruta en el cliente.
    # -------------------------------------------------------------------------
    location / {
        # El Panel ya no se sirve en el dominio viejo (ver arriba).
        if ($host = prosello.com.mx) { return 301 https://motopanda.mx$request_uri; }
        try_files $uri $uri/ /index.html;
    }

    # Defensivo: nada de dotfiles servidos directo. backend/ ya vive fuera del
    # docroot (carpeta hermana, ver deploy/vps/provision.sh), así que .env,
    # .git, etc. no existen físicamente aquí de todos modos.
    location ~ /\. {
        deny all;
    }
}
