# =============================================================================
# Nginx server block para delivery.prosello.com.mx (VPS)
#
# Se copia a /etc/nginx/sites-available/delivery.prosello.com.mx y se enlaza
# desde sites-enabled:
#
#     ln -s /etc/nginx/sites-available/delivery.prosello.com.mx \
#           /etc/nginx/sites-enabled/delivery.prosello.com.mx
#     nginx -t && systemctl reload nginx
#
# Traduce 1:1 el comportamiento de deploy/hostinger/htaccess-public_html (que
# gobernaba esto mismo en Apache, en el hosting compartido que se está
# retirando) a la sintaxis de Nginx + PHP-FPM. El orden de los bloques importa
# y no se debe alterar.
#
# certbot --nginx -d delivery.prosello.com.mx añade el bloque de :443 y el
# redirect HTTP->HTTPS por su cuenta la primera vez que se corre (Fase 4 del
# plan de migración) — no hace falta escribirlo a mano aquí.
# =============================================================================

# Host canónico: cualquier variante con "www" redirige a la forma limpia. Igual
# motivo que en el .htaccess viejo: la cookie de sesión es host-only, así que
# www.delivery... y delivery... son "sitios" distintos para el navegador.
server {
    listen 80;
    listen [::]:80;
    server_name www.delivery.prosello.com.mx;
    return 301 https://delivery.prosello.com.mx$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name delivery.prosello.com.mx;

    root /var/www/delivery.prosello.com.mx/public_html;
    index index.html;

    client_max_body_size 20m;

    # -------------------------------------------------------------------------
    # Lo que le toca a Laravel: /api/v1/*, /sanctum/* (cookie CSRF) y /up
    # (healthcheck). Van SIEMPRE al front controller (index.php, copiado desde
    # deploy/hostinger/index.php), exista o no como archivo en disco — mismo
    # criterio que la regla de Apache `RewriteRule ^(api|sanctum)(/.*)?$
    # index.php [L]`. No se usa PATH_INFO: Laravel resuelve el ruteo con
    # REQUEST_URI, que fastcgi_params ya manda tal cual.
    # -------------------------------------------------------------------------
    location ~ ^/(api|sanctum|up) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # -------------------------------------------------------------------------
    # Caché inmutable solo para los assets con hash de contenido en el nombre
    # (los .js/.css que genera Vite en cada build).
    # -------------------------------------------------------------------------
    location ~ "-[A-Za-z0-9_-]{8,}\.(js|css)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # El índice del SPA siempre se revalida contra el servidor.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # -------------------------------------------------------------------------
    # Todo lo demás es del SPA: si el archivo existe en disco se sirve tal
    # cual (assets, favicon), si no responde index.html y el router de Vue
    # resuelve la ruta en el cliente.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Defensivo: nada de dotfiles servidos directo. backend/ ya vive fuera del
    # docroot (carpeta hermana, ver deploy/vps/provision.sh), así que .env,
    # .git, etc. no existen físicamente aquí de todos modos.
    location ~ /\. {
        deny all;
    }
}
